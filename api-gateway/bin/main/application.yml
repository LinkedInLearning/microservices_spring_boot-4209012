spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: def_kitchen_route
          uri: http://localhost:8070
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Powered-By, FreddysAPIGateway
          predicates:
            - Path=/kitchen/**
      mvc:
        routes:
          - id: def_kitchen_route
            uri: http://localhost:8070
            filters:
              - StripPrefix=1
              - AddRequestHeader=X-Powered-By, FreddysAPIGateway
            predicates:
              - Path=/kitchen/**
#          - id: def_kitchen_rout
#            uri: http://localhost:8070
#            order: 10000
#            predicates:
#              - Path=/**

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: gateway

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.ipc.netty: DEBUG
    reactor.netty: DEBUG