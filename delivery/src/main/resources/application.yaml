spring:
  application:
    name: delivery
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  otlp:
    metrics:
      export:
        url: http://${OTEL_HOST:localhost}:4318/v1/metrics
        batch-size: 1
        step: 10s
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
