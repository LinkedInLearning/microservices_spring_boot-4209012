server:
  port: 8060

spring:
  application:
    name: order
management:
  otlp:
    metrics:
      export:
        url: http://${OTEL_HOST:localhost}:4318/v1/metrics
        batch-size: 1
        step: 10s
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

kitchen-service:
  url: http://localhost:8070

delivery-service:
  url: http://localhost:8060
